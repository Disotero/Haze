<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' 'unsafe-inline' file:; media-src file: data: blob: mediastream:" />
    <title>Haze — glass</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      #backdrop { position: fixed; pointer-events: none; }
      #backdrop .wall-fill {
        position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px);
        object-fit: cover; border: 0; filter: blur(30px) saturate(1.45) brightness(1.04);
      }
    </style>
  </head>
  <body>
    <!-- Blurred live capture of the screen, clipped to the widgets' glass. -->
    <div id="backdrop"></div>
    <script type="module" src="glass.js"></script>
  </body>
</html>
