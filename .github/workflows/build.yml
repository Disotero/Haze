# Сборка портативного Haze.exe на серверах GitHub.
#  • Вручную: Actions → «Сборка Haze.exe» → Run workflow. Версия берётся из package.json.
#    Готовый exe — в артефактах запуска.
#  • По тегу: git tag v0.1.2 && git push origin v0.1.2 — соберёт текущие исходники
#    и выложит Haze.exe в GitHub Releases.
name: Сборка Haze.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Сборке хватает чтения; право писать в репозиторий — только у шага релиза ниже.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Версия
        id: v
        # По тегу — имя тега без «v»; вручную — version из package.json.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(node -p "require('./package.json').version")"
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+[a-z]?$ ]] || { echo "::error::Версия должна быть вида 0.1.2 или 0.1.2c"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Зависимости
        run: npm ci

      - name: Проверка кода
        run: |
          npm run lint --if-present
          npm run test --if-present

      - name: Нативный помощник (Rust)
        # haze-sys.exe уходит в ресурсы exe через build.extraResources.
        run: |
          if [ -f native/haze-sys/Cargo.toml ]; then
            cargo test --release --manifest-path native/haze-sys/Cargo.toml
            cargo build --release --manifest-path native/haze-sys/Cargo.toml
          fi

      - name: Сборка
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # без подписи сертификатом
        run: npm run dist

      - uses: actions/upload-artifact@v6
        with:
          name: Haze-${{ steps.v.outputs.version }}
          path: dist/Haze.exe

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Haze-${{ needs.build.outputs.version }}

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Haze ${{ needs.build.outputs.version }}
          files: Haze.exe
