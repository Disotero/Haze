# Сборка портативного Haze.exe на серверах GitHub.
#  • Вручную: Actions → «Сборка Haze.exe» → Run workflow, указать папку версии (0.1.0, 0.1.2).
#    Готовый exe — в артефактах запуска.
#  • По тегу: git tag v0.1.0 && git push origin v0.1.0 — соберёт папку 0.1.0
#    и выложит Haze.exe в GitHub Releases.
name: Сборка Haze.exe

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Папка версии, например 0.1.0"
        required: true
        default: "0.1.1"
  push:
    tags: ["v*"]

# Сборке хватает чтения; право писать в репозиторий — только у шага релиза ниже.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dir: ${{ steps.v.outputs.dir }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Какую версию собираем
        id: v
        # Ввод из формы — только через переменную окружения, не подстановкой в скрипт.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+[a-z]?$ ]] || { echo "::error::Версия должна быть вида 0.1.1 или 0.1.1c"; exit 1; }
          # С 0.1.1c приложение лежит в подпапке app/.
          if [ -f "$v/app/package.json" ]; then d="$v/app"; else d="$v"; fi
          test -f "$d/package.json" || { echo "::error::Нет папки $v с package.json"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.v.outputs.dir }}/package-lock.json

      - name: Зависимости
        working-directory: ${{ steps.v.outputs.dir }}
        run: npm ci

      - name: Проверка кода
        working-directory: ${{ steps.v.outputs.dir }}
        run: |
          npm run lint --if-present
          npm run test --if-present

      - name: Нативный помощник (Rust)
        working-directory: ${{ steps.v.outputs.dir }}
        # С 0.1.2: haze-sys.exe уходит в ресурсы exe через build.extraResources.
        run: |
          if [ -f native/haze-sys/Cargo.toml ]; then
            cargo test --release --manifest-path native/haze-sys/Cargo.toml
            cargo build --release --manifest-path native/haze-sys/Cargo.toml
          fi

      - name: Сборка
        working-directory: ${{ steps.v.outputs.dir }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # без подписи сертификатом
        run: npm run dist

      - uses: actions/upload-artifact@v6
        with:
          name: Haze-${{ steps.v.outputs.version }}
          path: ${{ steps.v.outputs.dir }}/dist/Haze.exe

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Haze-${{ needs.build.outputs.version }}

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Haze ${{ needs.build.outputs.version }}
          files: Haze.exe
