<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' 'unsafe-inline' file:; img-src file: data:; script-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'" />
    <title>Haze</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="browser.css" />
  </head>
  <body>
    <header>
      <div class="nav">
        <button data-cmd="back" id="back" title="Назад"></button>
        <button data-cmd="forward" id="forward" title="Вперёд"></button>
        <button data-cmd="reload" id="reload" title="Обновить"></button>
      </div>
      <form class="address" id="form">
        <img id="fav" alt="" />
        <input id="url" spellcheck="false" autocomplete="off" />
        <span class="title" id="title"></span>
      </form>
      <span class="slim-title" id="slimTitle"></span>
      <div class="nav">
        <button data-cmd="mode" id="mode" title="Вид панели: полная → тонкая → без панели"></button>
        <button data-cmd="external" id="external" title="Открыть в обычном браузере"></button>
      </div>
      <div class="win">
        <button data-cmd="min" title="Свернуть"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button data-cmd="max" title="Во весь экран"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1.5"/></svg></button>
        <button data-cmd="close" class="close" title="Закрыть"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
      </div>
    </header>
    <div class="loading" id="loading"></div>
    <script type="module" src="browser.js"></script>
  </body>
</html>
